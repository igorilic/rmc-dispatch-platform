[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

# Always the latest stable releases; Dependabot proposes bumps, `make audit` checks RustSec.
[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.clippy]
# SPEC §15: no unwrap()/expect() outside tests (allowed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
