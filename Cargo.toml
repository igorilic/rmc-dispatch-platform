[workspace]
resolver = "3"
members = ["crates/*"]
# Its own workspace for now: see crates/plant-agent/Cargo.toml.
exclude = ["crates/plant-agent"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

# Always the latest stable releases; Dependabot proposes bumps, `make audit` checks RustSec.
[workspace.dependencies]
anyhow = "1.0.104"
async-nats = "0.52.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] } # no plots: faster builds
csv = "1.4.0"
domain = { path = "crates/domain" }
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] } # k3s v1.37 in k3d
kube = { version = "5.1.0", features = ["runtime", "derive"] } # default TLS: rustls with ring, like russh
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] } # no push gateway, no TLS
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "internal-logs"] } # OTLP/HTTP: no gRPC stack
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"] }
proptest = "1.12.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false } # webhooks are plain HTTP inside compose
rumqttc = { version = "0.25.1", default-features = false, features = ["url"] } # plain MQTT inside compose, no TLS
russh = { version = "0.65.1", default-features = false, features = ["ring"] } # ring: no cmake/aws-lc build deps
russh-sftp = "3.0.1"
schemars = { version = "1.2.3", features = ["chrono04"] } # the CRD's schema, for kube's derive
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] } # exact f64 round trips (plans, events)
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] } # no TLS: local Postgres
telemetry = { path = "crates/telemetry" }
testcontainers = "0.28.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["axum", "vendored"] } # vendored: no download at build

[workspace.lints.clippy]
# SPEC §15: no unwrap()/expect() outside tests (allowed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
