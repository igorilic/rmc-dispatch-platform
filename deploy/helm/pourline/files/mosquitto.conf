# Mosquitto for compose and the cloud chart: compose mounts this file, the chart puts it in a ConfigMap.
listener 1883
# ponytail: anonymous is fine for a 127.0.0.1-only dev broker; add password_file before exposing it.
allow_anonymous true
# Ingest keeps a persistent session; while it restarts, the broker queues its QoS 1 messages.
# The default (1000) would drop telematics after ~40 s of downtime.
max_queued_messages 100000
# A plant's outbox deletes a ticket once the broker acknowledges it, so the broker must not lose
# what it acknowledged: persist it, saving after every change rather than every 30 minutes. The
# file holds only sessions and queued messages, so saving it is cheap. /mosquitto/data is the
# image's volume, which compose keeps across restarts.
persistence true
persistence_location /mosquitto/data/
autosave_on_changes true
autosave_interval 1
