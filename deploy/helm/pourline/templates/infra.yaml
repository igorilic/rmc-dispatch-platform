# Infrastructure, with the same pinned images as deploy/compose. Dependabot only bumps compose's,
# so bump these with them. Data lives in emptyDir volumes: it survives a container restart, not a
# deleted pod, like compose's `make down -v`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          envFrom: [{ secretRef: { name: dev-credentials } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2.15.3-alpine
          args: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
          ports: [{ containerPort: 4222 }, { containerPort: 8222 }]
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  # 8222 is NATS's monitoring endpoint, which the e2e test reads through the API server's proxy.
  ports: [{ name: client, port: 4222 }, { name: monitoring, port: 8222 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          ports: [{ containerPort: 1883 }]
          readinessProbe:
            tcpSocket: { port: 1883 }
            periodSeconds: 2
          # The whole ConfigMap as the config directory, not one file through subPath, so it
          # picks up ConfigMap updates.
          volumeMounts:
            - { name: config, mountPath: /mosquitto/config, readOnly: true }
            - { name: data, mountPath: /mosquitto/data }
      volumes:
        - { name: config, configMap: { name: mosquitto-config } }
        - { name: data, emptyDir: {} }
---
# Inside the cluster only: the plant reaches Mosquitto through its uplink (cloud:1884), below.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app: mosquitto }
  ports: [{ port: 1883 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
spec:
  selector: { matchLabels: { app: sftp } }
  template:
    metadata: { labels: { app: sftp } }
    spec:
      containers:
        - name: sftp
          image: linuxserver/openssh-server:10.3_p1-r2-ls243
          env:
            - { name: USER_NAME, valueFrom: { secretKeyRef: { name: dev-credentials, key: SFTP_USER } } }
            - { name: USER_PASSWORD, valueFrom: { secretKeyRef: { name: dev-credentials, key: SFTP_PASSWORD } } }
            - { name: PASSWORD_ACCESS, value: "true" }
            - { name: TZ, value: Europe/Berlin }
          ports: [{ containerPort: 2222 }]
          readinessProbe:
            tcpSocket: { port: 2222 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: sftp
spec:
  selector: { app: sftp }
  ports: [{ port: 2222 }]
---
# Traces, so the services have somewhere to send their spans (SPEC §8). The UI is at
# http://localhost:8080/jaeger/ through the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          # The UI under /jaeger, which the ingress forwards without stripping it. The flag merges
          # onto Jaeger's built-in all-in-one config.
          args: ["--set=extensions.jaeger_query.base_path=/jaeger"]
          ports: [{ containerPort: 16686 }, { containerPort: 4318 }]
          readinessProbe:
            httpGet: { path: /status, port: 13133 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app: jaeger }
  ports: [{ name: ui, port: 16686 }, { name: otlp-http, port: 4318 }]
---
{{- if .Values.edge.plantAddress }}
# The plant's uplink (SPEC §9): the plant-agent reaches Mosquitto, dispatch and Jaeger only through
# these proxies, on the cloud node's LoadBalancer ports, so the console can cut and restore the
# link. Toxiproxy's API stays inside the cluster. Only with a plant (edge.plantAddress), so kind
# gets no LoadBalancer. Nothing bumps this image: check it at each milestone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uplink-config
data:
  toxiproxy.json: |
{{ .Files.Get "files/toxiproxy.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uplink
spec:
  selector: { matchLabels: { app: uplink } }
  template:
    metadata:
      labels: { app: uplink }
      # Toxiproxy reads its proxies at startup.
      annotations: { checksum/config: {{ .Files.Get "files/toxiproxy.json" | sha256sum }} }
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.13.0
          # Args replace the image's own -host=0.0.0.0, so it is repeated here.
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - { name: api, containerPort: 8474 }
            - { name: mqtt, containerPort: 1884 }
            - { name: dispatch, containerPort: 8088 }
            - { name: otlp, containerPort: 4318 }
          # On the API, which answers during a cut too, and 404s if the config didn't load. A
          # probe on a proxy would fail during every cut, take the API's Service away with it,
          # and keep Reconnect from reaching it. No liveness probe: a restart would end a cut
          # behind the console's back.
          readinessProbe:
            httpGet: { path: /proxies/dispatch, port: api }
            periodSeconds: 2
          volumeMounts: [{ name: config, mountPath: /config, readOnly: true }]
      volumes:
        - { name: config, configMap: { name: uplink-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: uplink
spec:
  selector: { app: uplink }
  ports: [{ name: api, port: 8474 }]
---
# The proxies on the cloud node, where the plant cluster reaches them as `cloud`.
apiVersion: v1
kind: Service
metadata:
  name: uplink-edge
spec:
  type: LoadBalancer
  selector: { app: uplink }
  ports:
    - { name: mqtt, port: 1884 }
    - { name: dispatch, port: 8088 }
    - { name: otlp, port: 4318 }
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
{{ .Files.Get "files/mosquitto.conf" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-credentials
stringData:
  {{- with .Values.credentials }}
  POSTGRES_USER: {{ .postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .postgres.password | quote }}
  POSTGRES_DB: {{ .postgres.database | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s" .postgres.user .postgres.password .postgres.database | quote }}
  SFTP_USER: {{ .sftp.user | quote }}
  SFTP_PASSWORD: {{ .sftp.password | quote }}
  {{- end }}
