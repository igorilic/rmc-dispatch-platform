# The plant-agent. Its SQLite file lives on a volume, so the outbox and the plan survive a new pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plant-agent
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-agent
spec:
  # One writer for the SQLite file: the old pod stops before the new one starts.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: plant-agent } }
  template:
    metadata: { labels: { app: plant-agent } }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 65532 }
      containers:
        - name: plant-agent
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - { name: PLANT_ID, value: {{ .Values.plantId | quote }} }
            - { name: DISPATCH_URL, value: {{ .Values.dispatchUrl | quote }} }
            - { name: MQTT_URL, value: {{ .Values.mqttUrl | quote }} }
            - { name: PLANT_AGENT_DB, value: /data/plant-agent.sqlite }
          ports:
            - { name: http, containerPort: 8082 }
            - { name: metrics, containerPort: 9466 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          # Ready once it has a plan, fetched or stored: an offline plant keeps working.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: plant-agent } }
---
apiVersion: v1
kind: Service
metadata:
  name: plant-agent
spec:
  selector: { app: plant-agent }
  ports:
    - { name: http, port: 8082 }
    - { name: metrics, port: 9466 }
