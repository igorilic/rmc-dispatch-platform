listener 1883
# ponytail: anonymous is fine for a 127.0.0.1-only dev broker; add password_file before exposing it.
allow_anonymous true
# Ingest keeps a persistent session; while it restarts, the broker queues its QoS 1 messages.
# The default (1000) would drop telematics after ~40 s of downtime.
max_queued_messages 100000
