# Local stack (SPEC §9): infrastructure, the simulators, ingest, dispatch and Walldorf's plant-agent.
# Images are pinned to exact versions; Dependabot proposes bumps.
# Host ports bind to 127.0.0.1 only: the dev credentials below never leave this machine.
name: pourline

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pourline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pourline}
      POSTGRES_DB: ${POSTGRES_DB:-pourline}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.15.2-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    ports: ["127.0.0.1:1883:1883"]
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 2s
      retries: 30

  sftp:
    image: linuxserver/openssh-server:10.3_p1-r2-ls243
    environment:
      USER_NAME: ${SFTP_USER:-pourline}
      USER_PASSWORD: ${SFTP_PASSWORD:-pourline}
      PASSWORD_ACCESS: "true"
      TZ: Europe/Berlin
    ports: ["127.0.0.1:2222:2222"]
    healthcheck:
      # ponytail: the image has no netcat, so look for the listening socket (0x08AE = 2222).
      test: ["CMD-SHELL", "grep -q ':08AE ' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      retries: 30

  ingest:
    build:
      context: ../..
      args: { BIN: ingest }
    env_file: [{ path: ../../.env, required: false }]
    environment:
      NATS_URL: nats://nats:4222
      MQTT_URL: mqtt://mosquitto:1883
      SFTP_HOST: sftp
      SFTP_PORT: "2222"
      MAPPINGS_DIR: /customers
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Mapping configs are files, not code: edit, then `docker compose restart ingest`.
    volumes: ["../../customers:/customers:ro"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      nats: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
      sftp: { condition: service_healthy }
    restart: unless-stopped

  dispatch:
    build:
      context: ../..
      args: { BIN: dispatch }
    env_file: [{ path: ../../.env, required: false }]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pourline}:${POSTGRES_PASSWORD:-pourline}@postgres:5432/${POSTGRES_DB:-pourline}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: unless-stopped

  simulators:
    build:
      context: ../..
      args: { BIN: simulators }
    env_file: [{ path: ../../.env, required: false }]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SFTP_HOST: sftp
      SFTP_PORT: "2222"
      BAUWERK_WEBHOOK_URL: http://ingest:8080/webhooks/bauwerk-ag
      NECKAR_WEBHOOK_URL: http://ingest:8080/webhooks/neckar-infra
      # make demo slows order generation down, so its scenario stays readable.
      ORDER_INTERVAL_SECS: ${ORDER_INTERVAL_SECS:-180}
      # Walldorf's plant-agent is its batch computer, so its fake one stays quiet.
      AGENT_PLANTS: plant-walldorf
    depends_on:
      mosquitto: { condition: service_healthy }
      sftp: { condition: service_healthy }
      ingest: { condition: service_started }
    restart: unless-stopped

  # The edge agent for Walldorf (SPEC §6). Here it shares the host with the cloud; make k8s runs it
  # in a cluster of its own. Prometheus also reaches it over `edge`, so the dashboard keeps showing
  # its outbox when it is cut off the default network (docker network disconnect).
  plant-agent:
    build:
      context: ../..
      args: { BIN: plant-agent }
    env_file: [{ path: ../../.env, required: false }]
    environment:
      PLANT_ID: plant-walldorf
      DISPATCH_URL: http://dispatch:8081
      MQTT_URL: mqtt://mosquitto:1883
      PLANT_AGENT_DB: /data/plant-agent.sqlite
    volumes: ["plant-agent:/data"]
    networks: [default, edge]
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      mosquitto: { condition: service_healthy }
      dispatch: { condition: service_started }
    restart: unless-stopped

  # make demo's scripted scenario; runs once, only with --profile demo.
  demo:
    profiles: [demo]
    build:
      context: ../..
      args: { BIN: demo }
    env_file: [{ path: ../../.env, required: false }]
    environment:
      DISPATCH_URL: http://dispatch:8081
      DISPATCH_PUBLIC_URL: http://localhost:8081
      INGEST_URL: http://ingest:8080
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      dispatch: { condition: service_started }
      ingest: { condition: service_started }
      mosquitto: { condition: service_healthy }

  # Observability (SPEC §8): Prometheus scrapes ingest, dispatch and the plant-agent, Grafana opens
  # on the provisioned "Dispatch overview", Jaeger keeps traces in memory.
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [default, edge]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # Read-only without a login, so the links from make demo just open; admin/admin edits.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dispatch-overview.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 2s
      retries: 30

# The plant-agent keeps its SQLite file here; make down deletes it with the other volumes.
volumes:
  plant-agent:

# Prometheus scrapes the plant-agent over `edge`, which a cut of the default network leaves alone.
networks:
  edge:
