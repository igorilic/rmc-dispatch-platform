# Scrapes ingest, dispatch and the plant-agent (SPEC §8). Their metrics ports stay inside the
# compose networks.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["ingest:9464"] }]
  - job_name: dispatch
    static_configs: [{ targets: ["dispatch:9465"] }]
  - job_name: plant-agent
    static_configs: [{ targets: ["plant-agent:9466"], labels: { plant: plant-walldorf } }]
