name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch new RustSec advisories without a code change

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: make test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: make audit

  # Prove every service image still builds.
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: [simulators, ingest, dispatch, demo, plant-agent]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg BIN=${{ matrix.bin }} -t pourline/${{ matrix.bin }}:ci .
