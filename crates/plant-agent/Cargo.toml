# The plant-agent is its own Cargo workspace. rusqlite 0.42 needs libsqlite3-sys 0.40, but the root
# workspace's sqlx 0.9.0 caps it below 0.38 (even with only the postgres driver), and one lockfile
# may hold only one crate that links `sqlite3`. Older rusqlite releases fit, but bundle a SQLite with
# RUSTSEC-2026-0459. Merge back into the root workspace once sqlx allows libsqlite3-sys >= 0.39:
# delete the empty [workspace] table below and the root's `exclude`.
# Versions match the root workspace's; Dependabot bumps both.
[workspace]

[package]
name = "plant-agent"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
domain = { path = "../domain" }
metrics = "0.24.6"
reqwest = { version = "0.13.5", default-features = false } # plain HTTP to dispatch, no TLS
rumqttc = { version = "0.25.1", default-features = false, features = ["url"] } # plain MQTT, no TLS
rusqlite = { version = "0.42.0", features = ["bundled"] } # bundled: SQLite 3.54.1 compiled in, no system library
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
telemetry = { path = "../telemetry" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
telemetry = { path = "../telemetry", features = ["testing"] }
testcontainers = "0.28.0"
tower = { version = "0.5.3", features = ["util"] }

# The root workspace's lints, which a second workspace can't inherit.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
